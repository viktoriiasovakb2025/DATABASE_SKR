[project]
name = "database-skr"
version = "0.1.0"
description = "REST API for a student management system"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
"ruff",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
